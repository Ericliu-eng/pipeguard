[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pipeguard"
version = "1.0.0"
description = "Lightweight data pipeline monitoring and incident analysis platform"
readme = "README.md"
requires-python = ">=3.11"
# Upper bounds stop at the next minor release, not the next major one. A minor
# release is enough to change behaviour: SQLAlchemy 2.1 switched the default
# PostgreSQL driver from psycopg2 to psycopg3, and the old ">=2.0,<3.0" range let
# a fresh production install pick it up and crash on an import the code never
# asked for. Patch releases still float so security fixes arrive without an edit.
dependencies = [
  "httpx>=0.28,<0.29",
  "alembic>=1.18,<1.19",
  "fastapi>=0.141,<0.142",
  "pydantic-settings>=2.15,<2.16",
  "sqlalchemy>=2.1,<2.2",
  "uvicorn[standard]>=0.52,<0.53",
  "psycopg[binary]>=3.3,<3.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<8.5",
  "ruff>=0.16,<0.17",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/pipeguard"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

