services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: pipeguard-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////data/pipeguard.db
      APP_NAME: ${APP_NAME:-PipeGuard API}
      APP_ENV: ${APP_ENV:-development}
      NULL_RATE_THRESHOLD: ${NULL_RATE_THRESHOLD:-0.05}
      DUPLICATE_RATE_THRESHOLD: ${DUPLICATE_RATE_THRESHOLD:-0.01}
      FRESHNESS_HOURS_THRESHOLD: ${FRESHNESS_HOURS_THRESHOLD:-24}
      ROW_COUNT_DROP_THRESHOLD: ${ROW_COUNT_DROP_THRESHOLD:-0.30}
      ROW_COUNT_HISTORY_SIZE: ${ROW_COUNT_HISTORY_SIZE:-5}
      RUN_RETENTION_LIMIT: ${RUN_RETENTION_LIMIT:-500}
      INGEST_API_KEY: ${INGEST_API_KEY:-}
    volumes:
      - pipeguard_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pipeguard_data:
